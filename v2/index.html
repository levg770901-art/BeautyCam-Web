<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>BeautyCam V2.0</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="stage">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
    <div id="hint" class="hint">BeautyCam V2.0</div>
    <div id="status" class="status">尚未啟動</div>
  </section>
  <section class="panel">
    <div class="toolbar">
      <button id="start">開啟相機</button>
      <button id="switch" disabled>切換鏡頭</button>
      <button id="capture" class="primary" disabled>拍照</button>
      <button id="save" disabled>儲存</button>
    </div>
    <div class="section-title">自然美肌</div>
    <div class="slider"><label>柔焦 <output id="softValue">35</output></label><input id="soft" type="range" min="0" max="100" value="35"></div>
    <div class="slider"><label>膚色 <output id="toneValue">20</output></label><input id="tone" type="range" min="0" max="100" value="20"></div>
    <div class="slider"><label>亮度 <output id="lightValue">12</output></label><input id="light" type="range" min="0" max="100" value="12"></div>
    <div class="section-title">彩妝</div>
    <div class="presets">
      <button data-look="none" class="active">素顏</button>
      <button data-look="natural">自然</button>
      <button data-look="rose">玫瑰</button>
      <button data-look="warm">暖色</button>
    </div>
    <div class="slider"><label>彩妝強度 <output id="makeupValue">0</output></label><input id="makeup" type="range" min="0" max="100" value="0"></div>
    <button id="reset" class="reset">重設</button>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
