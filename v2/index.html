<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>BeautyCam V2.0 Core</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app">
<header class="topbar"><div><h1>BeautyCam</h1><p>V2.0 Core · Natural Beauty Pipeline</p></div><span class="version">CORE 1</span></header>
<section class="stage" aria-label="V2.0 相機預覽">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="placeholder" class="placeholder">點擊「開啟前鏡頭」</div>
</section>
<section class="controls">
<div class="control-row"><label>美肌 <output id="smoothValue">35</output></label><input id="smooth" type="range" min="0" max="100" value="35"></div>
<div class="control-row"><label>磨皮 <output id="softenValue">20</output></label><input id="soften" type="range" min="0" max="100" value="20"></div>
<div class="control-row"><label>美白 <output id="whitenValue">10</output></label><input id="whiten" type="range" min="0" max="100" value="10"></div>
</section>
<section class="actions">
<button id="start" class="secondary">開啟前鏡頭</button>
<button id="switch" class="secondary" disabled>切換鏡頭</button>
<button id="capture" class="primary" disabled>拍照</button>
<button id="save" class="secondary" disabled>儲存照片</button>
<button id="reset" class="secondary">重設</button>
</section>
<p id="status" class="status">V2.0 Core 尚未啟動</p>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
