<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>BeautyCam Web V1.6.1</title><link rel="stylesheet" href="styles.css?v=1.6.1"></head><body><main class="app"><header class="topbar"><div><h1>BeautyCam</h1><p>Natural Beauty Engine</p></div><span class="version">V1.6.1</span></header><section class="stage" aria-label="相機預覽"><video id="video" autoplay playsinline muted></video><canvas id="previewCanvas" aria-hidden="true"></canvas><img id="photoPreview" alt="照片預覽"><div id="placeholder" class="placeholder">選擇鏡頭後拍照</div></section><section class="controls"><div class="control-row"><label for="smooth">美肌 <output id="smoothValue">42</output></label><input id="smooth" type="range" min="0" max="100" value="42"></div><div class="control-row"><label for="soften">磨皮 <output id="softenValue">25</output></label><input id="soften" type="range" min="0" max="100" value="25"></div><div class="control-row"><label for="whiten">美白 <output id="whitenValue">14</output></label><input id="whiten" type="range" min="0" max="100" value="14"></div><div class="control-row"><label for="makeup">彩妝 <output id="makeupValue">0</output></label><input id="makeup" type="range" min="0" max="100" value="0"></div><div class="makeup-presets" aria-label="彩妝風格"><button type="button" class="makeup-preset active" data-makeup="0">素顏</button><button type="button" class="makeup-preset" data-makeup="natural">自然</button><button type="button" class="makeup-preset" data-makeup="rose">玫瑰</button><button type="button" class="makeup-preset" data-makeup="warm">氣色</button></div><div class="shape-row" aria-label="眉型"><span class="shape-label">眉型</span><button type="button" class="shape-btn active" data-brow="natural">自然</button><button type="button" class="shape-btn" data-brow="straight">平眉</button><button type="button" class="shape-btn" data-brow="arch">弧眉</button></div><div class="shape-row" aria-label="唇型"><span class="shape-label">唇型</span><button type="button" class="shape-btn active" data-lip="natural">自然</button><button type="button" class="shape-btn" data-lip="soft">柔霧</button><button type="button" class="shape-btn" data-lip="full">豐潤</button></div></section><section class="actions"><button id="startCamera" class="secondary">開啟前鏡頭</button><button id="switchCamera" class="secondary" disabled>切換後鏡頭</button><button id="capture" class="primary" disabled>拍照</button><button id="download" class="secondary" disabled>儲存照片</button><button id="reset" class="secondary">重設</button></section><input id="fileInput" type="file" accept="image/*" hidden><p id="status" class="status" role="status">請先選擇鏡頭</p></main><script src="makeup-engine.js?v=1.6.1"></script><script src="app.js?v=1.6.1"></script><script src="save-handler.js?v=1.6.1"></script><script>const E=()=>window.BeautyCamMakeup;document.querySelectorAll('.makeup-preset').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.makeup;document.querySelectorAll('.makeup-preset').forEach(x=>x.classList.toggle('active',x===b));const s=document.getElementById('makeup');s.value=v==='0'?0:Math.max(55,+s.value);document.getElementById('makeupValue').textContent=s.value;E()?.setStyle(v==='0'?'natural':v);E()?.setAmount(s.value)}));document.getElementById('makeup')?.addEventListener('input',e=>{E()?.setAmount(e.target.value);if(+e.target.value>0&&document.querySelector('.makeup-preset.active')?.dataset.makeup==='0'){document.querySelector('[data-makeup="natural"]').click()}});document.querySelectorAll('[data-brow]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-brow]').forEach(x=>x.classList.toggle('active',x===b));E()?.setBrowShape(b.dataset.brow)}));document.querySelectorAll('[data-lip]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-lip]').forEach(x=>x.classList.toggle('active',x===b));E()?.setLipShape(b.dataset.lip)}));</script></body></html>
